name: Android Deploy

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-deploy.yml'
  workflow_dispatch:

concurrency:
  group: android-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: kiwi-assistant-494421
  GCP_REGION: europe-west1
  APK_BUCKET: kiwi-assistant-494421-apks
  CLOUD_RUN_SERVICE: kiwi-backend

jobs:
  build:
    name: Build, sign, upload, publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Resolve version metadata
        id: version
        run: |
          # Pin versionCode to a monotonically-increasing run number so
          # the AutoUpdater can do a strict greater-than comparison.
          VC="${{ github.run_number }}"
          VN="0.1.${VC}"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "apk_url=https://storage.googleapis.com/${APK_BUCKET}/kiwi-v${VC}.apk" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        working-directory: android
        env:
          KIWI_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KIWI_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CLOUD_RUN_URL: ${{ secrets.CLOUD_RUN_URL }}
          KIWI_API_KEY: ${{ secrets.KIWI_API_KEY }}
          DEV_LOGS_TOKEN: ${{ secrets.DEV_LOGS_TOKEN }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload APK to Cloud Storage
        env:
          VC: ${{ steps.version.outputs.version_code }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          DEST="gs://${APK_BUCKET}/kiwi-v${VC}.apk"
          gcloud storage cp "$APK" "$DEST"
          # Mirror as latest.apk so the URL is stable for ad-hoc downloads.
          gcloud storage cp "$APK" "gs://${APK_BUCKET}/latest.apk"

      - name: Update Cloud Run env vars
        env:
          VC: ${{ steps.version.outputs.version_code }}
          VN: ${{ steps.version.outputs.version_name }}
          APK_URL: ${{ steps.version.outputs.apk_url }}
        run: |
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --region="$GCP_REGION" \
            --update-env-vars="APP_VERSION_CODE=${VC},APP_VERSION_NAME=${VN},APK_URL=${APK_URL}"

      - name: Print deploy summary
        env:
          VC: ${{ steps.version.outputs.version_code }}
          VN: ${{ steps.version.outputs.version_name }}
          APK_URL: ${{ steps.version.outputs.apk_url }}
        run: |
          echo "::notice::Released kiwi v${VN} (versionCode=${VC})"
          echo "::notice::APK: ${APK_URL}"
