name: Backend Deploy

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT: kiwi-assistant-494421
  GCP_REGION: europe-west1
  AR_REPO: kiwi
  SERVICE_NAME: kiwi-backend
  RUNTIME_SA: kiwi-backend@kiwi-assistant-494421.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE:${{ github.sha }}" \
            --region="$GCP_REGION" \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --timeout=3600 \
            --session-affinity \
            --concurrency=80 \
            --set-env-vars="GCP_PROJECT=${GCP_PROJECT},GCP_LOCATION=${GCP_REGION}" \
            --set-secrets="KIWI_API_KEY=KIWI_API_KEY:latest"

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region="$GCP_REGION" \
            --format='value(status.url)')
          echo "Deployed: $URL"
          echo "::notice::Backend live at $URL"
