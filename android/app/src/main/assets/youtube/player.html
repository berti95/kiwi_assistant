<!--
  YouTube embed host page for Kiwi.

  Loaded from android/assets and rendered inside an Android WebView.
  The Compose layer substitutes ``__VIDEO_ID__`` with the real id
  before handing the HTML to the WebView.

  Implementation note — why a plain <iframe> instead of the IFrame
  Player JS API:
  - The JS API path (loadDataWithBaseURL + YT.Player + postMessage)
    repeatedly produced "152-4" / "Video no disponible" errors in
    real WebView testing on the tablet. The exact origin of the
    failure is hard to pin down (cookie / iframe origin / postMessage
    same-origin checks all interact in subtle ways), but a plain
    iframe pointing at YouTube's standard embed URL is the lowest-
    common-denominator and works for every embeddable video.
  - We don't currently expose voice control of the player (pause,
    skip, …) so the JS API didn't earn its complexity. When Fase 8
    (unified MediaController) wires that up we'll pull it back via
    a postMessage bridge inside the same iframe.
-->
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html, body, iframe {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    border: none;
    overflow: hidden;
  }
</style>
</head>
<body>
  <iframe
    src="https://www.youtube.com/embed/__VIDEO_ID__?autoplay=1&playsinline=1&rel=0"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    allowfullscreen>
  </iframe>
</body>
</html>
