<!--
  YouTube IFrame Player host page for Kiwi.

  Loaded from android/assets and rendered inside an Android WebView.
  The Compose layer injects a window.kiwiVideoId variable BEFORE
  loading the page (via loadDataWithBaseURL substitution); on
  YouTube's iframe_api ready event we instantiate a player at full
  size that auto-plays.

  base URL is set to https://www.youtube.com so cookies + the
  IFrame API postMessage origin checks succeed.
-->
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #player { width: 100vw; height: 100vh; }
</style>
</head>
<body>
  <div id="player"></div>
  <script>
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.body.appendChild(tag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '__VIDEO_ID__',
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: function (e) { e.target.playVideo(); }
        }
      });
    }
  </script>
</body>
</html>
